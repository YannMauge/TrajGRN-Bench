name: sc_dynamic
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - pip >= 22.0.4
  - python = 3.8
  - numpy >= 1.19.5
  - pandas >= 1.3.5
  - pytorch >= 1.13.1
  - matplotlib >= 3.4.3
  - scikit-learn >= 1.0.1
  - scipy >= 1.5.4
  - scanpy >= 1.9.3
  - pip:
    - boltons >= 23.0.0
    - torchdiffeq
    - torchsde >= 0.2.5
    - geomloss