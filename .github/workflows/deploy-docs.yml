# =============================================================================
# GitHub Actions — Deploy MkDocs to GitHub Pages
# =============================================================================
name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "methods_registry.yaml"
      - "utils/**"
      - "post_analysis/**"
      - "configs/**"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch: # Allow manual trigger

# Grant the deployment job GITHUB_TOKEN the needed permissions
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pixi (locked docs environment)
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.84.2
          environments: docs
          locked: true

      - name: Build docs
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
        run: pixi run -e docs mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
