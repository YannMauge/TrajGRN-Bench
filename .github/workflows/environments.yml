name: environments

# Checks that pixi.lock matches pixi.toml, that environments install on Linux
# and macOS (Apple Silicon), and that every method image builds and imports.
on:
  pull_request:
    paths: ["pixi.toml", "pixi.lock", "containers/**", "methods_registry.yaml", ".github/workflows/environments.yml"]
  push:
    branches: [main]
    paths: ["pixi.toml", "pixi.lock", "containers/**", "methods_registry.yaml", ".github/workflows/environments.yml"]
  workflow_dispatch:

jobs:
  lock-and-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.84.2
          run-install: false
      - name: Lock file is up to date
        run: pixi lock --check
      - name: Install runner + baselines
        run: |
          pixi install --locked -e runner
          pixi install --locked -e baselines
      - name: Import smoke test
        run: |
          pixi run -e runner python -c "import anndata, scanpy, harissa, ot, yaml, jsonschema"
          pixi run -e baselines python -c "import sys; sys.path[:0]=['methods','methods/genie3/GENIE3_python','methods/dynGENIE3']; import _common, GENIE3, dynGENIE3"

  images:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        env: [baselines, cardamom, flecs, scnode, trajectorynet, reference-fitting, renge]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: |
          docker buildx build -f containers/docker/Dockerfile \
            --build-arg PIXI_ENV=${{ matrix.env }} --platform linux/amd64 --load \
            -t benchmark/${{ matrix.env }}:ci .
      - name: Python starts in the image
        run: docker run --rm benchmark/${{ matrix.env }}:ci python -c "import numpy, anndata; print('ok')"
